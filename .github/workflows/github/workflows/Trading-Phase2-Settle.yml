name: Trading-Phase2-Settle
on:
  schedule:
    - cron: "10 21 * * *" # UTC21:10 = 北京时间05:10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase2 Settle
        env:
          FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python -c "import os;os.makedirs('output',exist_ok=True)"
          python simulate_trading.py --phase settle

      - name: Commit & Push settle result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "auto: phase2 settle $(date +%Y%m%d_%H%M)" || echo "no changes"
          git push
