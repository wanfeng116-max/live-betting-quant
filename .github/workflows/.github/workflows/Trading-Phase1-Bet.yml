name: Trading-Phase1-Bet
on:
  schedule:
    # UTC时间，对应北京时间 02:00 / 03:00 / 04:00 / 05:00
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase1 Bet
        env:
          FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python -c "import os;os.makedirs('output',exist_ok=True)"
          python simulate_trading.py --phase bet

      - name: Commit & Push output data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "auto: phase1 bet $(date +%Y%m%d_%H%M)" || echo "no changes"
          git push
