name: Trading-Phase2-Settle
on:
  schedule:
    - cron: "0 4 * * *"    # UTC 04:00 = 北京时间每天中午12:00（前一天比赛已结束）
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Phase 2 (Settle)
        env:
          FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python simulate_trading.py --phase settle
      - name: Commit & Push output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "auto: phase2 settle $(date +%Y%m%d_%H%M)" || echo "no changes"
          git push
